server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O Angular resolve as rotas no cliente: qualquer caminho desconhecido
    # precisa devolver o index.html em vez de 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os bundles levam hash no nome (outputHashing: all), entao podem ser
    # cacheados sem risco de servir uma versao velha apos o deploy.
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Os links mudam sem rebuild, entao nunca podem vir do cache.
    location = /data/links.json {
        add_header Cache-Control "no-store" always;
    }

    # O Uptime Kuma roda em outra porta, ou seja outra origem: sem este proxy a
    # pagina esbarraria em CORS ao ler o estado dos monitores. Os timeouts sao
    # curtos de proposito — se o Kuma cair, os cards perdem o indicador, mas a
    # pagina continua abrindo normalmente.
    location /api/uptime/ {
        proxy_pass http://100.93.9.20:3001/api/status-page/;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store" always;
    }
}
