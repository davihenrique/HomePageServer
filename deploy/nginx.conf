server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O Angular resolve as rotas no cliente: qualquer caminho desconhecido
    # precisa devolver o index.html em vez de 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os bundles levam hash no nome (outputHashing: all), entao podem ser
    # cacheados sem risco de servir uma versao velha apos o deploy.
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Os links mudam sem rebuild, entao nunca podem vir do cache.
    location = /data/links.json {
        add_header Cache-Control "no-store" always;
    }
}
